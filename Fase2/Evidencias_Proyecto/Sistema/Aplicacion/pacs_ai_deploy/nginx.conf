worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ★ Permitir uploads grandes y evitar buffering en proxy
    client_max_body_size 1024m;         # 1 GB
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_max_temp_file_size 0;

    # ---- Flag para saber si el request viene desde el wrapper (/pacs-ai/) ----
    map $http_referer $from_pacsai {
        default       0;
        ~*/pacs-ai/   1;
    }

    server {
        listen      8042;
        server_name localhost;

        # ★ Redundancia por si config global no se aplica (seguro en Windows)
        client_max_body_size 1024m;
        proxy_request_buffering off;

        # ========= 1) Wrapper PACS-AI (estático) =========
        location ^~ /pacs-ai/ {
            alias  C:/Repos/PACS-AI-Assist/Fase2/Evidencias_Proyecto/Sistema/ohif_app/extensions/pacs-ai/;
            try_files $uri $uri/ =404;   # /pacs-ai/viewer.html debe existir aquí
        }

        # ========= 2) OHIF por proxy =========
        location = /ohif/viewer {
            if ($from_pacsai = 0) {
                return 302 /pacs-ai/viewer.html$is_args$args;
            }
            proxy_pass http://127.0.0.1:8043/ohif/viewer;
        }

        # Resto de rutas del OHIF (assets, JS, etc.)
        location ^~ /ohif/ {
            proxy_pass http://127.0.0.1:8043/ohif/;
        }

        # ========= 3) Endpoints DICOM que usa OHIF =========
        location ^~ /dicom-web/ {
            proxy_pass http://127.0.0.1:8043/dicom-web/;
        }

        location ^~ /wado/ {
            proxy_pass http://127.0.0.1:8043/wado/;
        }

        # ========= 4) Fallback: todo lo demás a Orthanc =========
        # ★ Aquí es donde pega tu backend a /instances — deja los límites también
        location / {
            client_max_body_size 1024m;     # ★
            proxy_request_buffering off;    # ★
            proxy_pass http://127.0.0.1:8043/;
        }
    }
}
