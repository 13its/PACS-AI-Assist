<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PACS-AI OHIF Wrapper (Merged v7 – centered)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0b1020; }
    #ohif { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; z-index: 1; }
    #pacsai-badge{ position:fixed; left:12px; top:12px; z-index:2147483647; background:#234;color:#9ef; padding:6px 10px; border-radius:8px; font:12px/1.2 system-ui, Segoe UI, Roboto, Arial; opacity:.9; box-shadow:0 2px 8px rgba(0,0,0,.25); transition: opacity .25s ease, transform .25s ease; }
    #pacsai-badge.hide{ opacity:0; transform:translateY(-6px); pointer-events:none; }
    #pacsai-fab{ position:fixed; right:16px; top:10px; z-index:2147483647; background:#0ea5e9; color:#fff; border:none; border-radius:10px; padding:10px 14px; font:600 14px/1 system-ui, Segoe UI, Roboto, Arial; box-shadow:0 4px 16px rgba(0,0,0,.25); cursor:pointer; }
    #pacsai-fab:hover{ filter:brightness(1.08); }
    #toast{ position:fixed; right:16px; bottom:16px; z-index:2147483647; background:#111827; color:#e5e7eb; padding:10px 12px; border-radius:8px; font:13px/1.2 system-ui, Segoe UI, Roboto, Arial; box-shadow:0 6px 20px rgba(0,0,0,.35); display:none; }
    #toast.ok{ background:#064e3b; color:#d1fae5; }
    #toast.err{ background:#7f1d1d; color:#fee2e2; }
  </style>
</head>
<body>
  <div id="pacsai-badge">PACS-AI: cargando...</div>
  <button id="pacsai-fab" title="Enviar a analizar con IA">Enviar a IA</button>
  <div id="toast"></div>
  <iframe id="ohif" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const BACKEND = 'http://127.0.0.1:8001/analyze/download-only';
    const CANDIDATE_OHIF_ROUTES = ['/ohif/viewer', '/ohif', '/ohif/', '/ohif-native/viewer'];

    const badge = document.getElementById('pacsai-badge');
    const fab   = document.getElementById('pacsai-fab');
    const toast = document.getElementById('toast');
    const iframe = document.getElementById('ohif');

    function showToast(msg, type=''){ toast.textContent = msg; toast.className = type ? type : ''; toast.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(()=> { toast.style.display='none'; }, 4500); }

    function getStudyUID(win=window){
      const q1 = new URLSearchParams(win && win.location && win.location.search || '');
      if(q1.get('StudyInstanceUIDs')) return (q1.get('StudyInstanceUIDs')||'').replace(/[<>]/g,'');
      if(q1.get('StudyInstanceUID'))  return (q1.get('StudyInstanceUID')||'').replace(/[<>]/g,'');
      for (const [k,v] of q1.entries()){ if (/uid/i.test(k) && v) return (v||'').replace(/[<>]/g,''); }
      return '';
    }

    async function detectOhifRoute(){
      for (const path of CANDIDATE_OHIF_ROUTES){
        try{
          const res = await fetch(path, { method:'GET' });
          if (res.ok || res.status === 200) return path;
        }catch(e){}
      }
      return null;
    }

    (async function loadIframe(){
      const base = await detectOhifRoute();
      if(!base){
        badge.textContent = 'No se encontró la ruta de OHIF (/ohif/viewer). Revisa ServeFolders/config.';
        return;
      }
      const sep = location.search.includes('?') ? '&' : '?';
      iframe.src = base + location.search + sep + 'pacsai=' + Date.now();
      iframe.addEventListener('load', () => { setTimeout(()=> badge.classList.add('hide'), 250); setTimeout(()=> badge.remove(), 800); tryMount(); }, { once:true });
      iframe.addEventListener('error', () => { badge.textContent = 'Error cargando visor'; });
    })();

    async function sendToAI(win){
      const suid = getStudyUID();
      if(!suid){ (win||window).alert('No se encontró StudyInstanceUID(s)'); return; }
      const oldTxt = fab.textContent;
      fab.disabled = true; fab.textContent = 'Enviando...';
      try{
        const res = await fetch(BACKEND,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ StudyInstanceUID: suid, background:true }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        showToast('✅ Enviado a IA correctamente', 'ok');
      }catch(e){ console.error(e); showToast('❌ Error al enviar a IA: ' + e.message, 'err'); }
      finally{ fab.textContent = oldTxt; fab.disabled = false; }
    }
    fab.addEventListener('click', ()=>sendToAI());

    function removeFab(){ if (fab) { fab.remove(); } }

    function ensureHeaderButton(iw){
      const doc = iw?.document; if (!doc) return false;
      if (doc.getElementById('pacsai-toolbar-btn')) { removeFab(); return true; }

      const header = doc.querySelector('header, [role="banner"], .ohif-header, .ohif-top-bar, .ViewerHeader, .ViewerTopBar') || doc.body;
      const allBtns = Array.from(header.querySelectorAll('button, [role="button"]')).filter(el => el.offsetParent !== null);
      if (allBtns.length < 3) return false; // esperamos a tener layout estable

      // contenedor más probable (padre común de la mayoría de botones)
      const parentCounts = new Map();
      allBtns.forEach(b => {
        const p = b.parentElement;
        if (!p) return;
        parentCounts.set(p, (parentCounts.get(p)||0)+1);
      });
      const toolbar = [...parentCounts.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0] || header;

      // Calcula índice medio (evita el slot del toggler desplegable si existe al final)
      const buttons = Array.from(toolbar.querySelectorAll('button, [role="button"]')).filter(el => el.offsetParent !== null);
      const midIndex = Math.floor(buttons.length / 2);

      const wrapper = doc.createElement('span');
      wrapper.id = 'pacsai-wrapper';
      wrapper.style.cssText = 'display:inline-flex;align-items:center;position:relative;margin:0 12px;z-index:2147483600;';

      const btn = doc.createElement('button');
      btn.id = 'pacsai-toolbar-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label','PACS-AI Assist');
      btn.title = 'Enviar a IA';
      // Build icon + label (safe SVG creation)
      const _ns = 'http://www.w3.org/2000/svg';
      const icon = doc.createElementNS(_ns, 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('width', '18');
      icon.setAttribute('height', '18');
      icon.setAttribute('aria-hidden', 'true');
      icon.style.marginRight = '8px';
      icon.style.flexShrink = '0';
      const path1 = doc.createElementNS(_ns, 'path');
      path1.setAttribute('fill', 'currentColor');
      path1.setAttribute('d','M11.5 2.75c-.9 0-1.74.3-2.38.82-.62.52-1.03 1.2-1.16 1.94A3.7 3.7 0 0 0 4.7 8.5c0 .4.06.82.18 1.22a3.26 3.26 0 0 0 1.16 1.7l.02.02-.03.1c-.2.73-.08 1.5.33 2.13.43.67 1.12 1.1 1.9 1.2l.1.01v.12c0 1.96 1.6 3.55 3.55 3.55h.3c.96 0 1.87-.4 2.52-1.08l.08-.09.11.02c.6.14 1.24.11 1.83-.07a3.19 3.19 0 0 0 2.14-4c1.01-.68 1.62-1.8 1.62-3 0-1.96-1.47-3.58-3.36-3.84a3.63 3.63 0 0 0-3.4-2.37c-.75 0-1.47.22-2.08.63a3.61 3.61 0 0 0-3.71-.93Z');
      const path2 = doc.createElementNS(_ns, 'path');
      path2.setAttribute('fill', 'currentColor');
      path2.setAttribute('d','M13.45 9.5c-.28 0-.5.22-.5.5s.22.5.5.5h.55c.97 0 1.75.78 1.75 1.75a.5.5 0 0 0 1 0A2.76 2.76 0 0 0 14 9.5h-.55Zm-2.9-.5c0-.28-.22-.5-.5-.5a2.76 2.76 0 0 0-2.75 2.75.5.5 0 0 0 1 0c0-.97.78-1.75 1.75-1.75.28 0 .5-.22.5-.5Zm4.45 4.8c0-.28-.22-.5-.5-.5h-.55a1.75 1.75 0 0 0-1.75 1.75.5.5 0 0 0 1 0c0-.97.78-1.75 1.75-1.75h.55c.28 0 .5-.22.5-.5Zm-4.2.2c-.28 0-.5.22-.5.5 0 .97-.78 1.75-1.75 1.75a.5.5 0 0 0 0 1 2.76 2.76 0 0 0 2.75-2.75c0-.28-.22-.5-.5-.5Z');
      icon.appendChild(path1);
      icon.appendChild(path2);
      const label = doc.createElement('span');
      label.textContent = 'PACS-AI';
      label.style.fontWeight = '600';
      label.style.letterSpacing = '.2px';
      btn.textContent = ''; btn.appendChild(icon); btn.appendChild(label);
      btn.style.cssText = 'position:relative;z-index:2147483601;padding:0 14px;border-radius:6px;border:1px solid rgba(0,0,0,0.35);background:#1b4b86;color:#f1f5ff;cursor:pointer;font:600 12px/1 system-ui,Segoe UI,Roboto,Arial;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:auto;box-shadow:0 2px 6px rgba(5,15,40,0.35);text-transform:uppercase;letter-spacing:0.35px;';
      const rs = iw.getComputedStyle(buttons[0]);
      const h  = parseFloat(rs.height) || 28;
      btn.style.height     = h + 'px'; btn.style.lineHeight = h + 'px'; if (rs.borderRadius) btn.style.borderRadius = rs.borderRadius; btn.style.width = Math.max(h*3, 84) + 'px'; btn.style.padding='0 14px'; btn.style.justifyContent='center';

      // Tooltip propio centrado
      const tip = doc.createElement('div');
      tip.id = 'pacsai-tip';
      tip.role = 'tooltip';
      tip.style.cssText = 'position:fixed;left:-9999px;top:-9999px;background:#0F1C3C;color:#E5E7EB;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font:12px/1.2 system-ui,Segoe UI,Roboto,Arial;white-space:nowrap;opacity:0;transition:opacity .12s ease, transform .12s ease;pointer-events:none;z-index:2147483646;transform:translate(-50%,4px)';
      tip.innerHTML = '<div style="font-weight:600; margin-bottom:2px;">Send to AI</div><div style="font-size:11px; color:#60A5FA;">Analizar nódulos candidatos</div>';
      const arrow = doc.createElement('div');
      arrow.style.cssText = 'position:absolute;top:-5px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:#161b22;border-left:1px solid rgba(255,255,255,0.12);border-top:1px solid rgba(255,255,255,0.12)';
      tip.appendChild(arrow);
      doc.body.appendChild(tip);

      function showTip(el){
        const r = el.getBoundingClientRect();
        const x = Math.round(r.left + r.width/2);
        const y = Math.round(r.bottom + 8);
        tip.style.left = x + 'px';
        tip.style.top  = y + 'px';
        tip.style.opacity = '1';
        tip.style.transform = 'translate(-50%,0)';
      }
      function hideTip(){
        tip.style.opacity = '0';
        tip.style.left = '-9999px';
        tip.style.top  = '-9999px';
        tip.style.transform = 'translate(-50%,4px)';
      }

      const orthoBg = '#1b4b86';
      const orthoBgHover = '#255ea7';
      btn.addEventListener('mouseenter', ()=>{ btn.style.background=orthoBgHover; showTip(btn); }, true);
      btn.addEventListener('mouseleave', ()=>{ btn.style.background=orthoBg; hideTip(); }, true);
      btn.addEventListener('mousemove',  (e)=>e.stopPropagation(), true);
      btn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); sendToAI(iw); };

      wrapper.appendChild(btn);
      wrapper.appendChild(tip);

      // Inserta en la posición media
      const ref = buttons[midIndex] || buttons[buttons.length-1];
      ref.insertAdjacentElement('beforebegin', wrapper);

      // normaliza spacing
      const ps = iw.getComputedStyle(toolbar);
      if (ps.display !== 'flex' && ps.display !== 'inline-flex') toolbar.style.display = 'inline-flex';
      if (!ps.gap || ps.gap === '0px') toolbar.style.gap = '12px';
      if (ps.alignItems !== 'center') toolbar.style.alignItems = 'center';

      removeFab();
      return true;
    }

    function tryMount(){
      const iw = iframe.contentWindow; if(!iw) return;
      let ticks = 0;
      const poll = setInterval(() => { const ok = ensureHeaderButton(iw); if (ok) { clearInterval(poll); return; } if (++ticks > 80) clearInterval(poll); }, 200);
      try{ const mo = new iw.MutationObserver(() => { ensureHeaderButton(iw); }); mo.observe(iw.document.documentElement, { childList: true, subtree: true }); }catch{}
    }
  </script>
</body>
</html>
