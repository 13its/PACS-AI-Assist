<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PACS-AI OHIF Wrapper</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <style>
    html,body,iframe { height:100%; width:100%; margin:0; border:0; }
    body { background:#0b1020; }
    #pacsai-badge{
      position:fixed;left:10px;top:10px;z-index:2147483647;
      background:#234;color:#9fefb3;padding:4px 8px;border-radius:8px;
      font:12px/1.2 system-ui,Segoe UI,Roboto,Arial;opacity:.9
    }
  </style>
</head>
<body>
  <div id="pacsai-badge">PACS-AI: cargando…</div>
  <iframe id="ohif" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const BACKEND = 'http://127.0.0.1:8001/analyze/download-only';
    const badge   = document.getElementById('pacsai-badge');
    const iframe  = document.getElementById('ohif');

    // Cache-buster para que SIEMPRE recargue el contenido del iframe
    const sep = location.search ? '&' : '?';
    iframe.src = '/ohif/viewer' + location.search + sep + 'pacsai=' + Date.now();

    const getStudyUID = (win) => {
      const q1 = new URLSearchParams((win&&win.location&&win.location.search)||'');
      const q2 = new URLSearchParams(location.search);
      return (q1.get('StudyInstanceUIDs') || q2.get('StudyInstanceUIDs') || '').replace(/[<>]/g,'');
    };

    async function sendToAI(win){
      const suid = getStudyUID(win);
      if(!suid){ (win||window).alert('No se encontró StudyInstanceUIDs'); return; }
      try{
        const res = await fetch(BACKEND,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({StudyInstanceUID:suid, background:true})
        });
        if(!res.ok) throw new Error('HTTP '+res.status);
        await res.json().catch(()=>{});
        (win||window).alert('Enviado a IA ✅');
      }catch(e){ console.error(e); (win||window).alert('Error red: '+e); }
    }

    function ensureHeaderButton(iw){
      const doc = iw?.document;
      if (!doc) return false;
      if (doc.getElementById('pacsai-toolbar-btn')) return true;

      // 1) Localiza header/toolbar y el botón "Reset"
      const header =
        doc.querySelector('header, [role="banner"], .ohif-header, .ohif-top-bar, .ViewerHeader, .ViewerTopBar') || doc.body;

      const resetBtn = Array.from(
        header.querySelectorAll('button, [role="button"], [data-cy]')
      ).find(el => {
        const t = (el.getAttribute?.('title') || el.getAttribute?.('aria-label') || el.textContent || '').trim();
        return /^(reset\s*view|reset|restablecer|reiniciar)/i.test(t);
      });
      if (!resetBtn) return false;

      // 2) Wrapper para controlar espaciado y tooltip propio
      const wrapper = doc.createElement('span');
      wrapper.id = 'pacsai-wrapper';
      wrapper.style.cssText = [
        'display:inline-flex','align-items:center','position:relative',
        'margin-left:14px'     // aire con el lado izquierdo (no mueve hacia la izq)
      ].join(';');

      // --- botón ---
      const btn = doc.createElement('button');
      btn.id = 'pacsai-toolbar-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label','PACS-AI Assist');
      // IMPORTANTE: sin title -> no tooltip nativo
      btn.textContent = 'PACS-AI Assist';
      btn.style.cssText = [
        'padding:0 10px','height:auto',
        'border-radius:4px','border:1px solid rgba(255,255,255,0.18)',
        'background:rgba(255,255,255,0.08)','color:#fff','cursor:pointer',
        'font:500 12px/1 system-ui,Segoe UI,Roboto,Arial',
        'display:inline-flex','align-items:center','gap:6px','white-space:nowrap',
        'pointer-events:auto','z-index:1',
        'margin-right:6px'     // ← aire con el “palito”/menú a la DERECHA
      ].join(';');

      // igualar altura/radio a Reset
      const rs = iw.getComputedStyle(resetBtn);
      const h  = parseFloat(rs.height) || 28;
      btn.style.height     = `${Math.round(h)}px`;
      btn.style.lineHeight = `${Math.round(h)}px`;
      if (rs.borderRadius) btn.style.borderRadius = rs.borderRadius;

      // === Tooltip GLOBAL (en <body>) estilo OHIF ===
      // === 0) limpiar tooltips antiguos (por si quedó alguno) ===
      doc.getElementById('pacsai-tip')?.remove();
      doc.getElementById('pacsai-reset-blocker')?.remove();

      // === 1) Tooltip ligero fijo dentro del iframe ===
      const tip = doc.createElement('div');
      tip.id = 'pacsai-tip';
      tip.role = 'tooltip';
      tip.style.cssText = [
        'position:fixed','left:-9999px','top:-9999px',
        'background:#161b22','color:#e6edf3',
        'border:1px solid rgba(255,255,255,0.12)','border-radius:6px',
        'padding:8px 10px','box-shadow:0 8px 24px rgba(0,0,0,.3)',
        'font:12px/1.2 system-ui,Segoe UI,Roboto,Arial',
        'white-space:nowrap','opacity:0',
        'transition:opacity .12s ease, transform .12s ease',
        'pointer-events:none','z-index:2147483647',
        'transform:translateY(4px)'
      ].join(';');
      tip.innerHTML = `
        <div style="font-weight:600; margin-bottom:2px;">Send to AI</div>
        <div style="font-size:11px; opacity:.8;">Analizar nódulos candidatos</div>
      `;
      const arrow = doc.createElement('div');
      arrow.style.cssText = [
        'position:absolute','top:-5px','left:50%','transform:translateX(-50%) rotate(45deg)',
        'width:10px','height:10px','background:#161b22',
        'border-left:1px solid rgba(255,255,255,0.12)',
        'border-top:1px solid rgba(255,255,255,0.12)'
      ].join(';');
      tip.appendChild(arrow);
      doc.body.appendChild(tip);

      function showTip(el){
        const r = el.getBoundingClientRect();
        const x = Math.round(r.left + r.width/2);
        const y = Math.round(r.bottom + 8);
        tip.style.left = x + 'px';
        tip.style.top  = y + 'px';
        tip.style.opacity = '1';
        tip.style.transform = 'translateY(0)';
      }
      function hideTip(){
        tip.style.opacity = '0';
        tip.style.left = '-9999px';
        tip.style.top  = '-9999px';
        tip.style.transform = 'translateY(4px)';
      }

      // === 2) Bloqueador invisible sobre el Reset (mientras hover) ===
      const blocker = doc.createElement('div');
      blocker.id = 'pacsai-reset-blocker';
      blocker.style.cssText = [
        'position:fixed','left:-9999px','top:-9999px',
        'width:1px','height:1px','z-index:2147483646',
        'background:transparent','pointer-events:auto' // atrapa el hover
      ].join(';');
      doc.body.appendChild(blocker);

      function showBlockerOverReset(){
        const r = resetBtn.getBoundingClientRect();
        blocker.style.left = r.left + 'px';
        blocker.style.top  = r.top  + 'px';
        blocker.style.width  = r.width  + 'px';
        blocker.style.height = r.height + 'px';
      }
      function hideBlocker(){
        blocker.style.left = '-9999px';
        blocker.style.top  = '-9999px';
        blocker.style.width = '1px';
        blocker.style.height = '1px';
      }

      // === 3) Evitar burbujeo + activar/desactivar bloqueo/tooltip ===
      const stop = (e)=>e.stopPropagation();
      btn.addEventListener('mouseenter', stop, true);
      btn.addEventListener('mouseleave', stop, true);
      btn.addEventListener('mousemove',  stop, true);

      btn.addEventListener('mouseenter', ()=>{
        // desactiva eventos directos del botón Reset y, adicionalmente, pon un blocker encima
        resetBtn._pe_prev = resetBtn.style.pointerEvents;
        resetBtn.style.pointerEvents = 'none';
        showBlockerOverReset();

        btn.style.background='rgba(255,255,255,0.16)';
        showTip(btn);
      }, true);

      btn.addEventListener('mouseleave', ()=>{
        resetBtn.style.pointerEvents = resetBtn._pe_prev || '';
        hideBlocker();

        btn.style.background='rgba(255,255,255,0.08)';
        hideTip();
      }, true);

      btn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); sendToAI(iw); };

      // montar
      wrapper.appendChild(btn);
      wrapper.appendChild(tip);

      // insertar: si hay separador tras Reset, va ANTES del separador; si no, después de Reset
      const next = resetBtn.nextElementSibling;
      if (next && (next.getAttribute('role') === 'separator' ||
                  /\bdivider|separator|Separator|ToolbarSeparator\b/i.test(next.className||''))) {
        next.parentElement.insertBefore(wrapper, next);
      } else {
        resetBtn.insertAdjacentElement('afterend', wrapper);
      }


      // Contenedor en flex + gap
      const parent = resetBtn.parentElement || header;
      const ps = iw.getComputedStyle(parent);
      if (ps.display !== 'flex' && ps.display !== 'inline-flex') parent.style.display = 'inline-flex';
      if (!ps.gap || ps.gap === '0px') parent.style.gap = '8px';
      if (ps.alignItems !== 'center') parent.style.alignItems = 'center';

      // Oculta badge y quita fallback si existiera
      const fb = doc.getElementById('pacsai-fallback-btn'); if (fb) fb.remove();
      const badgeEl = window.document.getElementById('pacsai-badge'); if (badgeEl) badgeEl.style.display='none';

      console.log('[PACS-AI] Botón PACS-AI Assist listo');
      return true;

      function insertBeforeSafe(parent, node, before){
        try { parent.insertBefore(node, before); } catch { resetBtn.insertAdjacentElement('afterend', node); }
      }
    }


    function tryMount(){
      const iw = iframe.contentWindow;
      if(!iw) return;

      // 1) intentar cada 200 ms hasta 16 s meterlo en header
      let ticks = 0;
      const poll = setInterval(() => {
        const ok = ensureHeaderButton(iw);
        if (ok) {
          clearInterval(poll);
          const fb = iw.document.getElementById('pacsai-fallback-btn');
          if (fb) fb.remove();
          return;
        }
        if (++ticks === 10) { // ~2s
          ensureFallbackButton(iw); // muestra algo mientras tanto
        }
        if (ticks > 80) clearInterval(poll); // dejamos el observer haciendo el trabajo fino
      }, 200);


      // 2) watchdog: si en 2 s no ha podido tocar el iframe, mete fallback
      const watchdog = setTimeout(()=>{ ensureFallback(iw); }, 2000);

      function ensureFallbackButton(iw){
        const doc = iw?.document;
        if (!doc) return false;
        if (doc.getElementById('pacsai-fallback-btn')) return true;

        const header = doc.querySelector('header, [data-cy="header"], .ohif-header, .ohif-top-bar, .ViewerHeader, .ViewerTopBar, .Header, .TopBar') || doc.body;
        const hRect  = header.getBoundingClientRect();

        // detecta el control más a la derecha para no taparlo
        let rightmost = null, maxRight = -Infinity;
        const candidates = Array.from(header.querySelectorAll('button, a[role="button"], [role="button"]'))
          .filter(el => el.offsetParent !== null);
        for (const el of candidates){
          const r = el.getBoundingClientRect();
          if (r.right > maxRight){ maxRight = r.right; rightmost = r; }
        }
        const safeRight = Math.max(12, Math.round((hRect.right - (rightmost ? rightmost.left : hRect.right)) + 12));
        const topPx     = Math.max(6, Math.round(hRect.top + (hRect.height - 28) / 2)); // centrado vertical en la barra

        const btn = doc.createElement('button');
        btn.id='pacsai-fallback-btn'; btn.type='button';
        btn.setAttribute('aria-label','Enviar a IA'); btn.title='Enviar a IA';
        btn.textContent='Enviar a IA';
        btn.style.cssText = [
          'position:fixed',
          `top:${topPx}px`,
          `right:${safeRight}px`,
          'z-index:2147483647',
          'padding:4px 10px',
          'height:28px','line-height:28px',
          'border-radius:8px',
          'border:1px solid rgba(255,255,255,0.18)',
          'background:rgba(255,255,255,0.08)',
          'color:#fff','cursor:pointer',
          'font:500 12px/28px system-ui,Segoe UI,Roboto,Arial',
          'display:inline-flex','align-items:center','gap:6px','white-space:nowrap',
          'backdrop-filter:blur(2px)'
        ].join(';');
        btn.onmouseenter=()=> (btn.style.background='rgba(255,255,255,0.16)');
        btn.onmouseleave=()=> (btn.style.background='rgba(255,255,255,0.08)');
        btn.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); sendToAI(iw); };

        doc.body.appendChild(btn);
        const badgeEl = window.document.getElementById('pacsai-badge');
        if (badgeEl) badgeEl.style.display='none';
        console.log('[PACS-AI] Botón fallback alineado con el header');
        return true;
      }

      // 3) si el layout del iframe cambia, reinyecta si hiciera falta
      try{
        const mo = new iw.MutationObserver(() => {
          const attached = ensureHeaderButton(iw);
          if (attached) {
            const fb = iw.document.getElementById('pacsai-fallback-btn');
            if (fb) fb.remove(); // si ya había fallback, lo quitamos
          } else {
            // si aún no hay nada, garantiza fallback visible
            if (!iw.document.getElementById('pacsai-toolbar-btn')) {
              ensureFallbackButton(iw);
            }
          }
        });
        mo.observe(iw.document.documentElement, { childList: true, subtree: true });
      }catch{}
    }

    // Dispara el hook de varias formas para no perder el evento
    iframe.addEventListener('load', ()=>{ tryMount(); });
    document.addEventListener('DOMContentLoaded', ()=>{ if (iframe.contentDocument || iframe.contentWindow) tryMount(); });
    // último recurso: intenta montar cada 1s por si el load se “escapó”
    let safety = 0; const kick = setInterval(()=>{ try{ tryMount(); clearInterval(kick);}catch(e){ if(++safety>5) clearInterval(kick); }},1000);
  </script>
</body>
</html>
